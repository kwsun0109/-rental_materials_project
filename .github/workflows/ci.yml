name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend (FastAPI) 검증
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 문법/임포트 오류 검사
        run: python -m py_compile $(find . -name "*.py")

      # 테스트 코드가 생기면 아래 주석을 해제하세요
      # - name: pytest 실행
      #   run: pytest

  frontend-check:
    name: Frontend (React) 검증
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      # ESLint 등이 설정되어 있으면 아래 주석을 해제하세요
      # - name: Lint
      #   run: npm run lint
